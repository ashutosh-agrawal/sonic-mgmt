<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="760" viewBox="0 0 1400 760" role="img" aria-labelledby="title desc">
  <title id="title">Physical and virtual SONiC testbed placement</title>
  <desc id="desc">In a physical testbed, PTF and neighbor VMs run on a test server and reach a physical DUT through VLAN interfaces, a server NIC, fanouts, and cables. In a virtual testbed, the KVM SONiC DUT runs on the same server and its interfaces connect directly to PTF and neighbor bridges without fanouts or DUT-facing VLAN tunnels.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="currentColor"/></marker>
    <style>
      .bg{fill:#fff}.panel{fill:#f8fafc;stroke:#94a3b8;stroke-width:2}.server{fill:#ecfdf5;stroke:#059669;stroke-width:2}.device{fill:#f1f5f9;stroke:#475569;stroke-width:2}.dut{fill:#eff6ff;stroke:#2563eb;stroke-width:2}.removed{fill:#fff7ed;stroke:#d97706;stroke-width:2;stroke-dasharray:8 7}
      .title{font:700 30px system-ui,sans-serif;fill:#0f172a}.subtitle{font:16px system-ui,sans-serif;fill:#475569}.head{font:700 22px system-ui,sans-serif;fill:#0f172a}.label{font:600 15px system-ui,sans-serif;fill:#1e293b}.small{font:13px system-ui,sans-serif;fill:#475569}.note{font:15px system-ui,sans-serif;fill:#334155}
      .link{fill:none;stroke:#059669;stroke-width:4;marker-end:url(#arrow);color:#059669}.wire{fill:none;stroke:#475569;stroke-width:3}
    </style>
  </defs>
  <rect width="1400" height="760" class="bg"/>
  <text x="40" y="45" class="title">Physical and VS testbeds preserve roles but change placement</text>
  <text x="40" y="73" class="subtitle">Tests may use similar topology names and fixtures even though the underlying link realization is different.</text>

  <rect x="40" y="110" width="640" height="575" rx="14" class="panel"/>
  <text x="65" y="148" class="head">Physical DUT</text>
  <rect x="75" y="185" width="355" height="280" rx="12" class="server"/>
  <text x="95" y="217" class="label">Test server</text>
  <rect x="105" y="255" width="125" height="65" rx="8" class="server"/><text x="147" y="293" class="label">PTF</text>
  <rect x="275" y="255" width="125" height="65" rx="8" class="server"/><text x="297" y="293" class="label">Neighbor VM</text>
  <rect x="190" y="365" width="125" height="65" rx="8" class="server"/><text x="218" y="393" class="label">OVS/VLAN</text><text x="218" y="415" class="small">server NIC</text>
  <path d="M168 320L220 365M338 320L285 365" class="wire"/>
  <rect x="485" y="220" width="150" height="75" rx="9" class="device"/><text x="510" y="252" class="label">Root fanout</text><text x="526" y="277" class="small">optional</text>
  <rect x="485" y="365" width="150" height="75" rx="9" class="device"/><text x="510" y="397" class="label">Leaf fanout</text><text x="516" y="422" class="small">VLAN map</text>
  <rect x="245" y="535" width="190" height="90" rx="9" class="dut"/><text x="300" y="570" class="label">Physical DUT</text><text x="277" y="597" class="small">front-panel cables</text>
  <path d="M315 397H450V257H485M560 295V365M560 440L435 565" class="link"/>
  <text x="80" y="655" class="note">Failure domains include NIC, VLAN, trunks, fanouts, optics, and cables.</text>

  <rect x="720" y="110" width="640" height="575" rx="14" class="panel"/>
  <text x="745" y="148" class="head">KVM SONiC DUT (VS setup)</text>
  <rect x="755" y="185" width="570" height="385" rx="12" class="server"/>
  <text x="780" y="217" class="label">One test server</text>
  <rect x="790" y="265" width="130" height="70" rx="8" class="server"/><text x="833" y="306" class="label">PTF</text>
  <rect x="975" y="265" width="145" height="70" rx="8" class="server"/><text x="1000" y="306" class="label">Neighbor VM</text>
  <rect x="875" y="390" width="155" height="75" rx="8" class="server"/><text x="910" y="421" class="label">OVS / veth</text><text x="900" y="446" class="small">direct host links</text>
  <rect x="1135" y="370" width="160" height="115" rx="9" class="dut"/><text x="1172" y="409" class="label">KVM SONiC</text><text x="1182" y="434" class="small">virtual DUT</text><text x="1166" y="459" class="small">vlab-01-N ports</text>
  <path d="M855 335L920 390M1047 335L985 390M1030 427H1135" class="link"/>
  <rect x="825" y="590" width="200" height="42" rx="8" class="removed"/><text x="845" y="617" class="label">No physical fanout</text>
  <rect x="1070" y="590" width="220" height="42" rx="8" class="removed"/><text x="1092" y="617" class="label">No DUT VLAN tunnel</text>
  <text x="760" y="660" class="note">Failure domains move to KVM, veth, Linux bridges, and OVS on one host.</text>

  <text x="40" y="725" class="note">The logical topology can still be T0 or T1; “physical” and “virtual” describe DUT placement, not the modeled network role.</text>
</svg>
