<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="830" viewBox="0 0 1400 830" role="img" aria-labelledby="title desc">
  <title id="title">Snappi control and dataplane stack</title>
  <desc id="desc">The control path runs from pytest through a Snappi client and API server to a traffic-generator backend or chassis; traffic ports connect to DUT ports, and metrics return through the control path.</desc>
  <defs><marker id="a" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0 0L10 4L0 8Z" fill="#475569"/></marker><marker id="g" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0 0L10 4L0 8Z" fill="#16a34a"/></marker>
    <style>.h1{font:700 30px system-ui,sans-serif;fill:#0f172a}.h2{font:700 18px system-ui,sans-serif;fill:#0f172a}.b{font:15px system-ui,sans-serif;fill:#334155}.s{font:13px system-ui,sans-serif;fill:#475569}.p{fill:#f8fafc;stroke:#cbd5e1;stroke-width:2;rx:16}.blue{fill:#dbeafe;stroke:#2563eb;stroke-width:2;rx:12}.green{fill:#dcfce7;stroke:#16a34a;stroke-width:2;rx:12}.purple{fill:#ede9fe;stroke:#7c3aed;stroke-width:2;rx:12}.orange{fill:#ffedd5;stroke:#ea580c;stroke-width:2;rx:12}.line{stroke:#475569;stroke-width:2.4;fill:none;marker-end:url(#a)}.data{stroke:#16a34a;stroke-width:4;fill:none;marker-end:url(#g)}.dash{stroke:#64748b;stroke-width:2;stroke-dasharray:7 6;fill:none;marker-end:url(#a)}</style>
  </defs>
  <rect width="1400" height="830" fill="#fff"/><text x="55" y="52" class="h1">Snappi separates API control from generated traffic</text><text x="55" y="80" class="b">The API server is not the chassis, and API success is not proof that a physical flow ran.</text>
  <rect x="45" y="115" width="1310" height="255" class="blue"/><text x="70" y="150" class="h2">Control and measurement path</text>
  <rect x="80" y="190" width="230" height="105" class="blue"/><text x="195" y="222" text-anchor="middle" class="h2">pytest</text><text x="195" y="250" text-anchor="middle" class="b">fixtures + helpers</text><text x="195" y="275" text-anchor="middle" class="s">scenario and thresholds</text>
  <rect x="380" y="190" width="230" height="105" class="blue"/><text x="495" y="222" text-anchor="middle" class="h2">Snappi client</text><text x="495" y="250" text-anchor="middle" class="b">OTG config/state/metrics</text><text x="495" y="275" text-anchor="middle" class="s">versioned API</text>
  <rect x="680" y="190" width="260" height="105" class="purple"/><text x="810" y="222" text-anchor="middle" class="h2">API server</text><text x="810" y="250" text-anchor="middle" class="b">ptf_ip + image</text><text x="810" y="275" text-anchor="middle" class="s">backend adapter/session</text>
  <rect x="1010" y="190" width="310" height="105" class="orange"/><text x="1165" y="222" text-anchor="middle" class="h2">TGEN backend / chassis</text><text x="1165" y="250" text-anchor="middle" class="b">port ownership + transmission</text><text x="1165" y="275" text-anchor="middle" class="s">IxNetwork · TRex · STC · backend</text>
  <path d="M310 242H370" class="line"/><path d="M610 242H670" class="line"/><path d="M940 242H1000" class="line"/>
  <path d="M1165 305C1165 340 495 340 495 305" class="dash"/><text x="830" y="355" text-anchor="middle" class="s">port/protocol/flow state and metrics return through the API</text>

  <rect x="45" y="405" width="1310" height="270" class="green"/><text x="70" y="440" class="h2">Physical dataplane path</text>
  <rect x="90" y="490" width="250" height="110" class="orange"/><text x="215" y="523" text-anchor="middle" class="h2">Chassis port A</text><text x="215" y="552" text-anchor="middle" class="b">chassis · card · port</text><text x="215" y="578" text-anchor="middle" class="s">speed · lane · FEC</text>
  <rect x="480" y="490" width="440" height="110" class="green"/><text x="700" y="523" text-anchor="middle" class="h2">DUT / multi-DUT network</text><text x="700" y="552" text-anchor="middle" class="b">interface · ASIC · routes · queues</text><text x="700" y="578" text-anchor="middle" class="s">fault or congestion under test</text>
  <rect x="1060" y="490" width="250" height="110" class="orange"/><text x="1185" y="523" text-anchor="middle" class="h2">Chassis port B</text><text x="1185" y="552" text-anchor="middle" class="b">receiver / peer</text><text x="1185" y="578" text-anchor="middle" class="s">per-flow counters</text>
  <path d="M340 545H470" class="data"/><path d="M920 545H1050" class="data"/>
  <text x="700" y="640" text-anchor="middle" class="s">sonic_tgen_links.csv binds each physical chassis/card/port to a DUT interface.</text>

  <rect x="45" y="715" width="1310" height="75" class="p"/><text x="70" y="746" class="h2">Result contract</text><text x="250" y="746" class="b">configuration accepted</text><text x="475" y="746" class="s">+</text><text x="505" y="746" class="b">ports/protocols up</text><text x="705" y="746" class="s">+</text><text x="735" y="746" class="b">Tx/Rx metrics</text><text x="890" y="746" class="s">+</text><text x="920" y="746" class="b">DUT counters/state</text><text x="1120" y="746" class="s">+</text><text x="1150" y="746" class="b">cleanup</text>
</svg>
