<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="800" viewBox="0 0 1400 800" role="img" aria-labelledby="title desc">
  <title id="title">Layered testbed deployment gates</title>
  <desc id="desc">Seven sequential gates from reservation and recovery through host preparation, topology realization, DUT deployment, progressive testing, and cleanup, each requiring separate evidence.</desc>
  <defs>
    <marker id="a" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0 0L10 4L0 8Z" fill="#475569"/></marker>
    <style>
      .h1{font:700 30px system-ui,sans-serif;fill:#0f172a}.h2{font:700 17px system-ui,sans-serif;fill:#0f172a}
      .b{font:14px system-ui,sans-serif;fill:#334155}.s{font:12px system-ui,sans-serif;fill:#475569}
      .p{fill:#f8fafc;stroke:#cbd5e1;stroke-width:2;rx:16}.blue{fill:#dbeafe;stroke:#2563eb;stroke-width:2;rx:12}
      .green{fill:#dcfce7;stroke:#16a34a;stroke-width:2;rx:12}.purple{fill:#ede9fe;stroke:#7c3aed;stroke-width:2;rx:12}
      .orange{fill:#ffedd5;stroke:#ea580c;stroke-width:2;rx:12}.line{stroke:#475569;stroke-width:2.3;fill:none;marker-end:url(#a)}
    </style>
  </defs>
  <rect width="1400" height="800" fill="#fff"/>
  <text x="55" y="52" class="h1">Deploy a lab through evidence gates</text>
  <text x="55" y="80" class="b">A successful command advances one gate; it does not prove later management, control-plane, or dataplane behavior.</text>
  <rect x="45" y="115" width="1310" height="530" class="p"/>

  <rect x="75" y="165" width="160" height="145" class="orange"/>
  <text x="155" y="198" text-anchor="middle" class="h2">0 · Own</text>
  <text x="155" y="228" text-anchor="middle" class="b">reserve</text>
  <text x="155" y="253" text-anchor="middle" class="b">baseline</text>
  <text x="155" y="278" text-anchor="middle" class="b">recovery</text>
  <text x="155" y="299" text-anchor="middle" class="s">allocation record</text>

  <rect x="260" y="165" width="160" height="145" class="blue"/>
  <text x="340" y="198" text-anchor="middle" class="h2">1 · Reach</text>
  <text x="340" y="228" text-anchor="middle" class="b">inventory</text>
  <text x="340" y="253" text-anchor="middle" class="b">credentials</text>
  <text x="340" y="278" text-anchor="middle" class="b">management</text>
  <text x="340" y="299" text-anchor="middle" class="s">read-only proof</text>

  <rect x="445" y="165" width="160" height="145" class="blue"/>
  <text x="525" y="198" text-anchor="middle" class="h2">2 · Prepare</text>
  <text x="525" y="228" text-anchor="middle" class="b">server / KVM</text>
  <text x="525" y="253" text-anchor="middle" class="b">images / OVS</text>
  <text x="525" y="278" text-anchor="middle" class="b">fanout trunks</text>
  <text x="525" y="299" text-anchor="middle" class="s">host evidence</text>

  <rect x="630" y="165" width="160" height="145" class="purple"/>
  <text x="710" y="198" text-anchor="middle" class="h2">3 · Realize</text>
  <text x="710" y="228" text-anchor="middle" class="b">add-topo</text>
  <text x="710" y="253" text-anchor="middle" class="b">PTF / neighbors</text>
  <text x="710" y="278" text-anchor="middle" class="b">links / backplane</text>
  <text x="710" y="299" text-anchor="middle" class="s">endpoint map</text>

  <rect x="815" y="165" width="160" height="145" class="green"/>
  <text x="895" y="198" text-anchor="middle" class="h2">4 · Deploy</text>
  <text x="895" y="228" text-anchor="middle" class="b">generate config</text>
  <text x="895" y="253" text-anchor="middle" class="b">apply to DUT</text>
  <text x="895" y="278" text-anchor="middle" class="b">converge</text>
  <text x="895" y="299" text-anchor="middle" class="s">observed facts</text>

  <rect x="1000" y="165" width="160" height="145" class="green"/>
  <text x="1080" y="198" text-anchor="middle" class="h2">5 · Test</text>
  <text x="1080" y="228" text-anchor="middle" class="b">collect</text>
  <text x="1080" y="253" text-anchor="middle" class="b">read-only</text>
  <text x="1080" y="278" text-anchor="middle" class="b">packet smoke</text>
  <text x="1080" y="299" text-anchor="middle" class="s">run artifacts</text>

  <rect x="1185" y="165" width="140" height="145" class="orange"/>
  <text x="1255" y="198" text-anchor="middle" class="h2">6 · Close</text>
  <text x="1255" y="228" text-anchor="middle" class="b">restore</text>
  <text x="1255" y="253" text-anchor="middle" class="b">remove</text>
  <text x="1255" y="278" text-anchor="middle" class="b">handoff</text>
  <text x="1255" y="299" text-anchor="middle" class="s">state record</text>

  <path d="M235 237H250" class="line"/><path d="M420 237H435" class="line"/><path d="M605 237H620" class="line"/>
  <path d="M790 237H805" class="line"/><path d="M975 237H990" class="line"/><path d="M1160 237H1175" class="line"/>

  <rect x="75" y="365" width="1250" height="225" class="p"/>
  <text x="100" y="402" class="h2">Acceptance evidence by plane</text>
  <text x="105" y="443" class="b">Management</text><text x="230" y="443" class="s">each endpoint reachable through declared inventory and credentials</text>
  <text x="105" y="480" class="b">Realization</text><text x="230" y="480" class="s">expected PTF, VM/container, namespace, OVS/VLAN, and fanout endpoints</text>
  <text x="105" y="517" class="b">Control plane</text><text x="230" y="517" class="s">DUT config, interfaces, neighbors, routes, and ASIC ownership observed</text>
  <text x="105" y="554" class="b">Dataplane</text><text x="230" y="554" class="s">one distinctive packet captured or counted across successive boundaries</text>

  <rect x="45" y="680" width="1310" height="75" class="orange"/>
  <text x="70" y="711" class="h2">Stop at the earliest failed gate</text>
  <text x="70" y="738" class="b">Do not edit feature tests to compensate for an unproven image, link, management path, or deployment.</text>
</svg>
