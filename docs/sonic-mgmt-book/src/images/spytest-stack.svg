<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="860" viewBox="0 0 1400 860" role="img" aria-labelledby="title desc">
  <title id="title">SPyTest architecture stack</title>
  <desc id="desc">A layered stack from test modules through feature APIs, utilities and parsing, framework lifecycle, CLI REST gNMI and traffic-generator access, DUT and TGEN targets, with native testbed input and result/batch output.</desc>
  <defs><marker id="a" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0 0L10 4L0 8Z" fill="#475569"/></marker>
    <style>.h1{font:700 30px system-ui,sans-serif;fill:#0f172a}.h2{font:700 18px system-ui,sans-serif;fill:#0f172a}.b{font:14px system-ui,sans-serif;fill:#334155}.s{font:12px system-ui,sans-serif;fill:#475569}.p{fill:#f8fafc;stroke:#cbd5e1;stroke-width:2;rx:16}.blue{fill:#dbeafe;stroke:#2563eb;stroke-width:2;rx:10}.green{fill:#dcfce7;stroke:#16a34a;stroke-width:2;rx:10}.purple{fill:#ede9fe;stroke:#7c3aed;stroke-width:2;rx:10}.orange{fill:#ffedd5;stroke:#ea580c;stroke-width:2;rx:10}.line{stroke:#475569;stroke-width:2.3;fill:none;marker-end:url(#a)}</style>
  </defs>
  <rect width="1400" height="860" fill="#fff"/><text x="55" y="52" class="h1">SPyTest is a separate native framework stack</text><text x="55" y="80" class="b">It uses pytest foundations but not the main sonic-mgmt fixture, testbed, or device-object model.</text>
  <rect x="250" y="115" width="900" height="95" class="purple"/><text x="700" y="148" text-anchor="middle" class="h2">SPyTest test module</text><text x="700" y="177" text-anchor="middle" class="b">scenario · module/function hooks · framework calls</text>
  <rect x="250" y="235" width="435" height="100" class="blue"/><text x="467" y="268" text-anchor="middle" class="h2">Feature APIs</text><text x="467" y="297" text-anchor="middle" class="b">configure / verify · UI selection</text><text x="467" y="320" text-anchor="middle" class="s">routing · switching · platform · QoS</text>
  <rect x="715" y="235" width="435" height="100" class="blue"/><text x="932" y="268" text-anchor="middle" class="h2">Utilities and parsing</text><text x="932" y="297" text-anchor="middle" class="b">reusable logic · TextFSM/templates</text><text x="932" y="320" text-anchor="middle" class="s">structured data and common helpers</text>
  <rect x="250" y="360" width="900" height="125" class="green"/><text x="700" y="393" text-anchor="middle" class="h2">SPyTest framework services</text><text x="700" y="425" text-anchor="middle" class="b">testbed/topology · connections · initialization/base config · lifecycle · logging</text><text x="700" y="455" text-anchor="middle" class="b">result classification · recovery · instrumentation · batch scheduling</text>
  <rect x="250" y="510" width="900" height="95" class="orange"/><text x="700" y="543" text-anchor="middle" class="h2">Access layer</text><text x="700" y="575" text-anchor="middle" class="b">CLI · REST · gNMI · UI-specific path · TGEN API</text>
  <rect x="250" y="630" width="435" height="100" class="green"/><text x="467" y="663" text-anchor="middle" class="h2">DUT devices</text><text x="467" y="692" text-anchor="middle" class="b">commands · config · state</text><text x="467" y="715" text-anchor="middle" class="s">logical names from SPyTest testbed</text>
  <rect x="715" y="630" width="435" height="100" class="orange"/><text x="932" y="663" text-anchor="middle" class="h2">Traffic generators</text><text x="932" y="692" text-anchor="middle" class="b">ports · protocols · streams · metrics</text><text x="932" y="715" text-anchor="middle" class="s">native TGEN topology ownership</text>
  <path d="M700 210V225" class="line"/><path d="M467 335V350" class="line"/><path d="M932 335V350" class="line"/><path d="M700 485V500" class="line"/><path d="M700 605V620" class="line"/>
  <rect x="45" y="250" width="170" height="370" class="purple"/><text x="130" y="285" text-anchor="middle" class="h2">Native inputs</text><text x="130" y="330" text-anchor="middle" class="b">testbed YAML</text><text x="130" y="362" text-anchor="middle" class="b">included files</text><text x="130" y="394" text-anchor="middle" class="b">links/topology</text><text x="130" y="426" text-anchor="middle" class="b">access/builds</text><text x="130" y="458" text-anchor="middle" class="b">parameters</text><text x="130" y="490" text-anchor="middle" class="b">error patterns</text><text x="130" y="550" text-anchor="middle" class="s">not ansible/testbed.yaml</text><path d="M215 435H240" class="line"/>
  <rect x="1185" y="250" width="170" height="370" class="blue"/><text x="1270" y="285" text-anchor="middle" class="h2">Outputs</text><text x="1270" y="330" text-anchor="middle" class="b">function/module</text><text x="1270" y="362" text-anchor="middle" class="b">device logs</text><text x="1270" y="394" text-anchor="middle" class="b">command logs</text><text x="1270" y="426" text-anchor="middle" class="b">syslog/results</text><text x="1270" y="458" text-anchor="middle" class="b">CSV / HTML</text><text x="1270" y="490" text-anchor="middle" class="b">dashboard</text><text x="1270" y="522" text-anchor="middle" class="b">batch/worker</text><path d="M1150 435H1175" class="line"/>
  <rect x="45" y="770" width="1310" height="55" class="p"/><text x="700" y="804" text-anchor="middle" class="b">Port test intent into SPyTest abstractions; do not translate duthosts/tbinfo/ptfadapter line by line.</text>
</svg>
