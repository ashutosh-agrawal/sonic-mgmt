<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900" role="img" aria-labelledby="title desc">
  <title id="title">sonic-mgmt configuration resolution</title>
  <desc id="desc">A layered diagram showing command line selection, testbed and inventory descriptions, topology and physical graph inputs, current pytest host objects, and live facts.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 Z" fill="#475569"/>
    </marker>
    <style>
      .h1 { font: 700 30px system-ui, sans-serif; fill: #0f172a; }
      .h2 { font: 700 20px system-ui, sans-serif; fill: #0f172a; }
      .body { font: 16px system-ui, sans-serif; fill: #334155; }
      .small { font: 14px system-ui, sans-serif; fill: #475569; }
      .label { font: 700 15px system-ui, sans-serif; fill: #1e3a8a; }
      .panel { fill: #f8fafc; stroke: #cbd5e1; stroke-width: 2; rx: 16; }
      .select { fill: #dbeafe; stroke: #2563eb; stroke-width: 2; rx: 12; }
      .logical { fill: #ede9fe; stroke: #7c3aed; stroke-width: 2; rx: 12; }
      .physical { fill: #ffedd5; stroke: #ea580c; stroke-width: 2; rx: 12; }
      .runtime { fill: #dcfce7; stroke: #16a34a; stroke-width: 2; rx: 12; }
      .arrow { fill: none; stroke: #475569; stroke-width: 2.5; marker-end: url(#arrow); }
      .dash { fill: none; stroke: #64748b; stroke-width: 2; stroke-dasharray: 8 7; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect width="1400" height="900" fill="#ffffff"/>
  <text x="60" y="55" class="h1">Configuration is resolved, not read from one file</text>
  <text x="60" y="85" class="body">Declared inputs select remote objects; deployed systems then supply observed facts.</text>

  <rect x="55" y="120" width="1290" height="135" class="panel"/>
  <text x="80" y="153" class="h2">1 · Runtime selection</text>
  <rect x="80" y="173" width="270" height="58" class="select"/>
  <text x="215" y="197" text-anchor="middle" class="label">run_tests.sh / pytest</text>
  <text x="215" y="218" text-anchor="middle" class="small">node ID, DUT, inventory</text>
  <rect x="420" y="173" width="285" height="58" class="select"/>
  <text x="562" y="197" text-anchor="middle" class="label">--testbed_file</text>
  <text x="562" y="218" text-anchor="middle" class="small">collection of instances</text>
  <rect x="775" y="173" width="250" height="58" class="select"/>
  <text x="900" y="197" text-anchor="middle" class="label">--testbed</text>
  <text x="900" y="218" text-anchor="middle" class="small">one conf-name</text>
  <rect x="1095" y="173" width="220" height="58" class="select"/>
  <text x="1205" y="197" text-anchor="middle" class="label">get_tbinfo()</text>
  <text x="1205" y="218" text-anchor="middle" class="small">normalized entry</text>
  <path d="M350 202 H410" class="arrow"/>
  <path d="M705 202 H765" class="arrow"/>
  <path d="M1025 202 H1085" class="arrow"/>

  <rect x="55" y="285" width="1290" height="245" class="panel"/>
  <text x="80" y="320" class="h2">2 · Description layers with different ownership</text>
  <rect x="80" y="350" width="270" height="130" class="select"/>
  <text x="215" y="382" text-anchor="middle" class="label">Testbed entry</text>
  <text x="215" y="410" text-anchor="middle" class="body">DUT · PTF · server</text>
  <text x="215" y="435" text-anchor="middle" class="body">topology · VM base</text>
  <text x="215" y="460" text-anchor="middle" class="small">binds intent to resources</text>

  <rect x="395" y="350" width="270" height="130" class="select"/>
  <text x="530" y="382" text-anchor="middle" class="label">Inventory</text>
  <text x="530" y="410" text-anchor="middle" class="body">groups · addresses</text>
  <text x="530" y="435" text-anchor="middle" class="body">connection · variables</text>
  <text x="530" y="460" text-anchor="middle" class="small">makes names reachable</text>

  <rect x="710" y="350" width="270" height="130" class="logical"/>
  <text x="845" y="382" text-anchor="middle" class="label">topo_&lt;name&gt;.yml</text>
  <text x="845" y="410" text-anchor="middle" class="body">neighbors · link indices</text>
  <text x="845" y="435" text-anchor="middle" class="body">roles · BGP · addresses</text>
  <text x="845" y="460" text-anchor="middle" class="small">declares logical intent</text>

  <rect x="1025" y="350" width="290" height="130" class="physical"/>
  <text x="1170" y="382" text-anchor="middle" class="label">Connection graph</text>
  <text x="1170" y="410" text-anchor="middle" class="body">DUT ↔ fanout links</text>
  <text x="1170" y="435" text-anchor="middle" class="body">console · PDU · VLAN path</text>
  <text x="1170" y="460" text-anchor="middle" class="small">declares physical mapping</text>

  <path d="M1205 231 V270 H215 V340" class="arrow"/>
  <path d="M1205 270 H530 V340" class="arrow"/>
  <path d="M1205 270 H845 V340" class="arrow"/>
  <path d="M1205 270 H1170 V340" class="arrow"/>

  <rect x="55" y="560" width="1290" height="130" class="panel"/>
  <text x="80" y="595" class="h2">3 · Current pytest control model</text>
  <rect x="95" y="615" width="230" height="50" class="select"/>
  <text x="210" y="646" text-anchor="middle" class="label">tbinfo</text>
  <rect x="360" y="615" width="230" height="50" class="select"/>
  <text x="475" y="646" text-anchor="middle" class="label">duthosts</text>
  <rect x="625" y="615" width="230" height="50" class="select"/>
  <text x="740" y="646" text-anchor="middle" class="label">ptfhosts</text>
  <rect x="890" y="615" width="200" height="50" class="select"/>
  <text x="990" y="646" text-anchor="middle" class="label">nbrhosts</text>
  <rect x="1125" y="615" width="190" height="50" class="select"/>
  <text x="1220" y="646" text-anchor="middle" class="label">fanouthosts</text>
  <path d="M215 480 V550" class="arrow"/>
  <path d="M530 480 V550" class="arrow"/>
  <path d="M845 480 V550" class="arrow"/>
  <path d="M1170 480 V550" class="arrow"/>

  <rect x="55" y="720" width="1290" height="130" class="runtime"/>
  <text x="80" y="755" class="h2">4 · Observed state from the deployed environment</text>
  <text x="95" y="792" class="body">minigraph / Config DB facts</text>
  <text x="395" y="792" class="body">ASIC namespaces and interfaces</text>
  <text x="745" y="792" class="body">routes, services and neighbors</text>
  <text x="1085" y="792" class="body">live link and packet evidence</text>
  <text x="95" y="825" class="small">Observed facts validate or contradict the declared and deployed model; they do not erase source ownership.</text>
  <path d="M475 665 V710" class="arrow"/>
  <path d="M740 665 V710" class="arrow"/>
  <path d="M990 665 V710" class="arrow"/>
  <path d="M1220 665 V710" class="arrow"/>
</svg>
