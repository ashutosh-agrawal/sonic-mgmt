<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="820" viewBox="0 0 1400 820" role="img" aria-labelledby="title desc">
  <title id="title">Reboot and upgrade observation timeline</title>
  <desc id="desc">A timeline showing baseline, observer arming, trigger, management disconnect, dataplane disruption, management return, service and routing convergence, traffic recovery, and restoration across separate observation lanes.</desc>
  <defs><marker id="a" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0 0L10 4L0 8Z" fill="#475569"/></marker>
    <style>.h1{font:700 30px system-ui,sans-serif;fill:#0f172a}.h2{font:700 17px system-ui,sans-serif;fill:#0f172a}.b{font:14px system-ui,sans-serif;fill:#334155}.s{font:12px system-ui,sans-serif;fill:#475569}.p{fill:#f8fafc;stroke:#cbd5e1;stroke-width:2;rx:16}.blue{fill:#dbeafe;stroke:#2563eb;stroke-width:2;rx:10}.green{fill:#dcfce7;stroke:#16a34a;stroke-width:2;rx:10}.orange{fill:#ffedd5;stroke:#ea580c;stroke-width:2;rx:10}.red{fill:#fee2e2;stroke:#dc2626;stroke-width:2;rx:10}.line{stroke:#475569;stroke-width:2.3;fill:none;marker-end:url(#a)}.grid{stroke:#cbd5e1;stroke-width:1.5;stroke-dasharray:6 6}</style>
  </defs>
  <rect width="1400" height="820" fill="#fff"/><text x="55" y="52" class="h1">Reboot is a multi-plane transition</text><text x="55" y="80" class="b">Management return precedes service, routing, and dataplane recovery; measure each on its own lane.</text>
  <rect x="45" y="115" width="1310" height="520" class="p"/>
  <text x="70" y="155" class="h2">time →</text><path d="M210 150H1315" class="line"/>
  <line x1="300" y1="175" x2="300" y2="610" class="grid"/><line x1="500" y1="175" x2="500" y2="610" class="grid"/><line x1="680" y1="175" x2="680" y2="610" class="grid"/><line x1="880" y1="175" x2="880" y2="610" class="grid"/><line x1="1080" y1="175" x2="1080" y2="610" class="grid"/>
  <text x="210" y="195" text-anchor="middle" class="s">baseline</text><text x="400" y="195" text-anchor="middle" class="s">trigger</text><text x="590" y="195" text-anchor="middle" class="s">booting</text><text x="780" y="195" text-anchor="middle" class="s">management back</text><text x="980" y="195" text-anchor="middle" class="s">converging</text><text x="1190" y="195" text-anchor="middle" class="s">stable</text>
  <text x="70" y="250" class="h2">Management</text><rect x="180" y="225" width="230" height="45" class="green"/><rect x="410" y="225" width="365" height="45" class="red"/><rect x="775" y="225" width="515" height="45" class="green"/><text x="295" y="253" text-anchor="middle" class="s">reachable</text><text x="592" y="253" text-anchor="middle" class="s">expected disconnect</text><text x="1032" y="253" text-anchor="middle" class="s">SSH/API reachable</text>
  <text x="70" y="340" class="h2">Services</text><rect x="180" y="315" width="230" height="45" class="green"/><rect x="410" y="315" width="470" height="45" class="red"/><rect x="880" y="315" width="210" height="45" class="orange"/><rect x="1090" y="315" width="200" height="45" class="green"/><text x="295" y="343" text-anchor="middle" class="s">healthy</text><text x="645" y="343" text-anchor="middle" class="s">stopped / starting</text><text x="985" y="343" text-anchor="middle" class="s">readiness checks</text><text x="1190" y="343" text-anchor="middle" class="s">healthy</text>
  <text x="70" y="430" class="h2">Control</text><rect x="180" y="405" width="230" height="45" class="green"/><rect x="410" y="405" width="560" height="45" class="red"/><rect x="970" y="405" width="170" height="45" class="orange"/><rect x="1140" y="405" width="150" height="45" class="green"/><text x="295" y="433" text-anchor="middle" class="s">routes/neighbors</text><text x="690" y="433" text-anchor="middle" class="s">down / partial</text><text x="1055" y="433" text-anchor="middle" class="s">converge</text><text x="1215" y="433" text-anchor="middle" class="s">stable</text>
  <text x="70" y="520" class="h2">Dataplane</text><rect x="180" y="495" width="280" height="45" class="green"/><rect x="460" y="495" width="390" height="45" class="red"/><rect x="850" y="495" width="230" height="45" class="orange"/><rect x="1080" y="495" width="210" height="45" class="green"/><text x="320" y="523" text-anchor="middle" class="s">baseline traffic</text><text x="655" y="523" text-anchor="middle" class="s">measured disruption / loss</text><text x="965" y="523" text-anchor="middle" class="s">recovering flows</text><text x="1185" y="523" text-anchor="middle" class="s">stable traffic</text>
  <text x="70" y="585" class="b">Observers</text><text x="180" y="585" class="s">PTF/TGEN sequence + console + management watcher + service/route polling + DUT logs</text>
  <rect x="45" y="680" width="1310" height="90" class="orange"/><text x="70" y="714" class="h2">Finish only after restoration</text><text x="70" y="746" class="b">verify image/cause + config + services + routes + traffic budget → stop observers → revert SAD changes → post-sanity</text>
</svg>
