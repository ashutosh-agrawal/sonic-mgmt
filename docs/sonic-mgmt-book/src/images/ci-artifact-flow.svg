<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="820" viewBox="0 0 1400 820" role="img" aria-labelledby="title desc">
  <title id="title">CI selection, execution, artifacts, and publication</title>
  <desc id="desc">A four-stage diagram showing pipeline and suite selection, environment and pytest execution, layered raw artifacts, and separately authenticated publication to reporting storage and dashboards.</desc>
  <defs><marker id="a" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0 0L10 4L0 8Z" fill="#475569"/></marker>
    <style>.h1{font:700 30px system-ui,sans-serif;fill:#0f172a}.h2{font:700 18px system-ui,sans-serif;fill:#0f172a}.b{font:15px system-ui,sans-serif;fill:#334155}.s{font:13px system-ui,sans-serif;fill:#475569}.p{fill:#f8fafc;stroke:#cbd5e1;stroke-width:2;rx:16}.blue{fill:#dbeafe;stroke:#2563eb;stroke-width:2;rx:12}.green{fill:#dcfce7;stroke:#16a34a;stroke-width:2;rx:12}.purple{fill:#ede9fe;stroke:#7c3aed;stroke-width:2;rx:12}.orange{fill:#ffedd5;stroke:#ea580c;stroke-width:2;rx:12}.red{fill:#fee2e2;stroke:#dc2626;stroke-width:2;rx:12}.line{stroke:#475569;stroke-width:2.3;fill:none;marker-end:url(#a)}</style>
  </defs>
  <rect width="1400" height="820" fill="#fff"/><text x="55" y="52" class="h1">CI is a selection and evidence pipeline</text><text x="55" y="80" class="b">A dashboard label is downstream of allocation, collection, all pytest phases, and publication.</text>
  <rect x="45" y="115" width="300" height="380" class="purple"/><text x="70" y="150" class="h2">1 · Select</text><text x="80" y="195" class="b">trigger / schedule</text><text x="80" y="230" class="b">pipeline template</text><text x="80" y="265" class="b">plan and suite</text><text x="80" y="300" class="b">topology + image</text><text x="80" y="335" class="b">testbed allocation</text><text x="80" y="370" class="b">pytest collection</text><text x="80" y="420" class="s">A node can disappear at each gate.</text>
  <rect x="385" y="115" width="300" height="380" class="green"/><text x="410" y="150" class="h2">2 · Execute</text><text x="420" y="195" class="b">deploy / baseline health</text><text x="420" y="230" class="b">fixture setup</text><text x="420" y="265" class="b">test call + traffic</text><text x="420" y="300" class="b">fixture teardown</text><text x="420" y="335" class="b">log analysis</text><text x="420" y="370" class="b">post-sanity / recovery</text><text x="420" y="420" class="s">Earliest phase identifies the owner.</text>
  <rect x="725" y="115" width="300" height="380" class="blue"/><text x="750" y="150" class="h2">3 · Preserve raw evidence</text><text x="760" y="195" class="b">job + pytest logs</text><text x="760" y="230" class="b">JUnit / Allure</text><text x="760" y="265" class="b">PTF logs + pcaps</text><text x="760" y="300" class="b">DUT / neighbor logs</text><text x="760" y="335" class="b">sanity + tech support</text><text x="760" y="370" class="b">TGEN config + metrics</text><text x="760" y="420" class="s">Artifacts answer different questions.</text>
  <rect x="1065" y="115" width="290" height="380" class="orange"/><text x="1090" y="150" class="h2">4 · Publish</text><text x="1100" y="195" class="b">parse XML</text><text x="1100" y="230" class="b">normalize records</text><text x="1100" y="265" class="b">add metadata</text><text x="1100" y="300" class="b">authenticated upload</text><text x="1100" y="335" class="b">Kusto / ADX</text><text x="1100" y="370" class="b">dashboard / query</text><text x="1100" y="420" class="s">Separate trust and failure boundary.</text>
  <path d="M345 305H375" class="line"/><path d="M685 305H715" class="line"/><path d="M1025 305H1055" class="line"/>
  <rect x="45" y="545" width="1310" height="210" class="p"/><text x="70" y="580" class="h2">Always retain a reproduction key</text>
  <text x="80" y="625" class="b">code commit + image</text><text x="330" y="625" class="b">job / testbed / topology</text><text x="650" y="625" class="b">DUT / ASIC / PTF</text><text x="930" y="625" class="b">seed + exact node ID</text>
  <text x="80" y="670" class="b">wrapper + printed pytest command</text><text x="480" y="670" class="b">first causal phase</text><text x="750" y="670" class="b">raw artifact links</text><text x="1030" y="670" class="b">cleanup/post-sanity</text>
  <rect x="75" y="705" width="1250" height="32" class="red"/><text x="700" y="727" text-anchor="middle" class="s">Upload failure does not erase a test run; a dashboard label does not replace raw evidence.</text>
</svg>
